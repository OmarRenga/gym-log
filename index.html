<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3B1F4D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym log">
<meta name="referrer" content="no-referrer">
<title>Gym log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root { --purple: #3B1F4D; --lilac: #B7A8CC; --cream: #F5F0E1; --ink: #1C1C1C; --gold: #D4AF37; --paper: #F7F4FA; --line: #DDD5E6; --muted: #6B6275; --ok: #2E7D4F; --warn: #B4532A; --card: #FFFFFF; }
@media (prefers-color-scheme: dark) { :root { --paper: #1E1424; --ink: #F1ECF5; --line: #3A2E44; --muted: #B3A8BF; --card: #2A1F31; --ok: #6FCF97; --warn: #F2994A; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
header { position: sticky; top: 0; z-index: 5; background: var(--purple); color: var(--cream); padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; display: flex; align-items: center; gap: 10px; }
header h1 { font: 600 19px/1.2 Georgia, "Times New Roman", serif; margin: 0; }
.sp { flex: 1; }
nav { display: flex; gap: 4px; }
nav button { background: none; border: 0; color: var(--cream); font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 8px; opacity: .75; }
nav button[aria-current="page"] { opacity: 1; box-shadow: inset 0 -2px 0 var(--gold); border-radius: 0; }
main { padding: 12px 14px calc(env(safe-area-inset-bottom) + 96px); max-width: 640px; margin: 0 auto; }
h2 { font: 600 20px/1.25 Georgia, serif; margin: 18px 0 8px; }
h3 { font-size: 16px; margin: 0; }
p { margin: 6px 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.days { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 12px 14px; min-height: 48px; }
.btn.primary { background: var(--purple); color: var(--cream); border-color: var(--purple); }
.btn.next { border: 2px solid var(--gold); }
.btn.small { min-height: 40px; padding: 8px 12px; font-size: 15px; }
.btn:disabled { opacity: .5; }
.ex { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 10px 0; }
.ex .tgt { color: var(--muted); font-size: 14px; }
.ex.main { border-left: 0; box-shadow: inset 0 0 0 2px var(--lilac); }
.set { display: grid; grid-template-columns: 30px 1fr 1fr 56px; gap: 8px; align-items: center; margin-top: 8px; }
.set .lab { color: var(--muted); font-size: 13px; text-align: center; }
.set input { width: 100%; font: inherit; font-size: 18px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); text-align: center; }
.set .tick { min-height: 46px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); font-size: 20px; color: var(--muted); }
.set .tick[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.plates { grid-column: 2 / 4; font-size: 12px; color: var(--muted); margin-top: -4px; }
.note { border-radius: 10px; padding: 10px 12px; margin: 10px 0; background: var(--card); border: 1px solid var(--line); }
.note.warn { border-color: var(--warn); color: var(--warn); }
.pain { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; margin: 6px 0; }
.pain button { font: inherit; font-size: 14px; padding: 9px 0; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); }
.pain button[aria-pressed="true"] { background: var(--purple); color: var(--cream); border-color: var(--purple); }
label.f { display: block; margin: 10px 0 4px; font-size: 14px; color: var(--muted); }
input.f, select.f, textarea.f { width: 100%; font: inherit; padding: 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
.list { list-style: none; padding: 0; margin: 0; }
.list li { padding: 10px 0; border-bottom: 1px solid var(--line); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 14px calc(env(safe-area-inset-bottom) + 10px); display: flex; gap: 8px; z-index: 6; }
.bar .btn { flex: 1; }
.check { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.check input { width: 24px; height: 24px; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 20px; font-size: 15px; z-index: 9; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>
<header><h1>Gym log</h1><span class="sp"></span>
<nav><button data-v="today" aria-current="page">Today</button><button data-v="history">History</button><button data-v="settings">Settings</button></nav></header>
<main id="main"></main>
<script src="app.js"></script>
</body>
</html>
